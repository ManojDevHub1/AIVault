<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" fill="none">
  <!-- AIVault Logo Mark -->
  <g transform="translate(4, 4)">
    <rect width="32" height="32" rx="8" fill="url(#vault-grad)" />
    <!-- Vault door / AI diamond icon -->
    <path d="M16 8L24 16L16 24L8 16Z" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF"/>
    <path d="M16 6V8M16 24V26M6 16H8M24 16H26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Wordmark -->
  <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
    AI<tspan fill="#2563EB">Vault</tspan>
  </text>
  <!-- Badge -->
  <rect x="116" y="11" width="36" height="17" rx="8.5" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
  <text x="134" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="9" font-weight="600" fill="#2563EB" letter-spacing="0.4">PRO</text>
  
  <defs>
    <linearGradient id="vault-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
</svg>
